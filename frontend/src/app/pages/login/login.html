<div class="login-bg">
  <div class="login-card glass">

    <div class="d-flex align-items-center gap-3 mb-2">
      <div class="brand-icon">
        <i class="bi bi-box-seam"></i>
      </div>
      <div>
        <div class="brand-name">Stockly</div>
        <div class="brand-tagline">Control de inventario</div>
      </div>
    </div>

    <div class="divider"></div>

    @if (errorMsg) {
      <div class="error-msg mb-3">
        <i class="bi bi-exclamation-circle me-2"></i>{{ errorMsg }}
      </div>
    }

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input
        type="email"
        class="form-control"
        placeholder="usuario@stockly.com"
        [(ngModel)]="email"
        [disabled]="cargando"
      />
    </div>

    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <div class="position-relative">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          class="form-control"
          placeholder="••••••••"
          [(ngModel)]="password"
          [disabled]="cargando"
          (keyup.enter)="iniciarSesion()"
        />
        <button
          type="button"
          class="btn btn-link position-absolute end-0 top-50 translate-middle-y pe-3 text-muted"
          style="font-size:0.85rem"
          (click)="mostrarPassword = !mostrarPassword"
        >
          <i class="bi" [class.bi-eye]="!mostrarPassword" [class.bi-eye-slash]="mostrarPassword"></i>
        </button>
      </div>
    </div>

    <button class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
      @if (cargando) {
        <span class="spinner-border spinner-border-sm me-2"></span>Iniciando...
      } @else {
        Iniciar sesión
      }
    </button>

  </div>
</div>
