<nav class="navbar navbar-expand-lg stockly-navbar">
  <div class="container-fluid px-4">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/dashboard">
      <div class="brand-mark">
        <i class="bi bi-box-seam"></i>
      </div>
      <span class="brand-text">Stockly</span>
    </a>

    <!-- Toggler mobile -->
    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
    >
      <i class="bi" [class.bi-list]="!menuAbierto" [class.bi-x-lg]="menuAbierto"></i>
    </button>

    <!-- Links -->
    <div class="navbar-collapse" [class.show]="menuAbierto" id="navbarNav">
      <ul class="navbar-nav me-auto gap-1">

        <li class="nav-item">
          <a class="nav-link nav-pill"
            routerLink="/dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="menuAbierto = false">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link nav-pill"
            routerLink="/productos"
            routerLinkActive="active"
            (click)="menuAbierto = false">
            <i class="bi bi-box me-1"></i>Productos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link nav-pill"
            routerLink="/categorias"
            routerLinkActive="active"
            (click)="menuAbierto = false">
            <i class="bi bi-tag me-1"></i>Categorías
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link nav-pill"
            routerLink="/stock"
            routerLinkActive="active"
            (click)="menuAbierto = false">
            <i class="bi bi-arrow-left-right me-1"></i>Movimientos
          </a>
        </li>

        <!-- Solo admin ve Reportes y Usuarios -->
        @if (isAdmin) {
          <li class="nav-item">
            <a class="nav-link nav-pill"
              routerLink="/reportes"
              routerLinkActive="active"
              (click)="menuAbierto = false">
              <i class="bi bi-bar-chart me-1"></i>Reportes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-pill"
              routerLink="/usuarios"
              routerLinkActive="active"
              (click)="menuAbierto = false">
              <i class="bi bi-people me-1"></i>Usuarios
            </a>
          </li>
        }

      </ul>

      <!-- Usuario + sesión -->
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        @if (usuario) {
          <li class="nav-item">
            <div class="user-chip">
              <div class="user-avatar">{{ usuario.nombre.charAt(0).toUpperCase() }}</div>
              <div class="user-info d-none d-lg-block">
                <div class="user-name">{{ usuario.nombre }}</div>
                <div class="user-role">{{ usuario.rol }}</div>
              </div>
            </div>
          </li>
        }
        <li class="nav-item">
          <button class="btn-logout" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-1"></i>
            <span class="d-none d-lg-inline">Salir</span>
          </button>
        </li>
      </ul>

    </div>
  </div>
</nav>
